import com.mikepenz.aboutlibraries.plugin.DuplicateMode

plugins {
    // TODO alias(libs.plugins.android.application)
    id("com.android.application")
    alias(libs.plugins.aboutlibraries) // has to be applied AFTER android
    alias(libs.plugins.cyclonedx)
    alias(libs.plugins.dependencycheck)
    alias(libs.plugins.likethesalad)
    alias(libs.plugins.scabbard)
    alias(libs.plugins.protobuf)
}

aboutLibraries {
    library.duplicationMode = DuplicateMode.MERGE
    collect.includePlatform = false
    export.prettyPrint = true
}

cyclonedxBom {
    projectType = "application"
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def nvdApiKey = localProps.getProperty("dependencyCheck.nvd.apiKey", "").trim()

dependencyCheck {
    scanConfigurations = ["withKeyReleaseRuntimeClasspath"]
    formats = ["HTML", "JSON", "SARIF"]
    nvd {
        apiKey = nvdApiKey
    }
    // failBuildOnCVSS = 9.0
}
// https://dependency-check.github.io/DependencyCheck/dependency-check-gradle/configuration.html
check.dependsOn dependencyCheckAnalyze

scabbard {
    enabled = !gradle.startParameter.toString().contains("assembleRelease")
    outputFormat = "svg" // we got png anyway :-/
    failOnError = true
    fullBindingGraphValidation = true
}

protobuf {
    protoc {
        artifact = "${libs.protobuf.java.get().group}:protoc:${libs.versions.protobufJavaVersion.get()}"
    }
    generateProtoTasks {
        all().forEach { task ->
            task.builtins {
                create("java") {
                    option("lite")
                }
//                create("kotlin")
            }
        }
    }
}

android {
    def marv42EbtNewNote = 'com.marv42.ebt.newnote'
    namespace = marv42EbtNewNote
    compileSdk = libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        applicationId = marv42EbtNewNote
        versionCode = libs.versions.code.get().toInteger()
        versionName = libs.versions.name.get()
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        multiDexEnabled = true
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules-acra.pro",
                    "proguard-rules-gson.pro",
                    "proguard-rules.pro")
            signingConfig = signingConfigs.debug
        }
        debug {
            debuggable = true
        }
    }

    flavorDimensions.add("ocrServiceKey")
    productFlavors {
        withKey {
            dimension = 'ocrServiceKey'
            versionNameSuffix = '-withKey'
        }
        withoutKey {
            dimension = 'ocrServiceKey'
        }
    }

    compileOptions {
        def javaVersion = libs.versions.javaVersion.get().toInteger()
        // https://developer.android.com/build/jdks
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

//    androidResources {
//        noCompress 'traineddata'
//        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~" +
//                ":*.best:*.orig:*.tmp"
//    }

    lint {
        disable += 'MissingTranslation'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true

            all {
                it.jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs += ["-Xlint:deprecation"]
                options.compilerArgs += ["-Xlint:unchecked"]
            }
        }
    }
}

dependencies {
    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.acra.mail)
    implementation(libs.acra.toast)
    implementation(libs.core)
    implementation(libs.appcompat)
    implementation(libs.recyclerview)
    implementation(libs.exifinterface)
    implementation(libs.fragment)
    implementation(libs.preference)
    implementation(libs.security.crypto)
    implementation(libs.datastore)
    implementation(libs.protobuf.java)
    implementation(libs.tink)
    implementation(libs.material)
    implementation(libs.gson)
    implementation(libs.dagger.android.support)
    annotationProcessor("com.google.dagger:dagger-compiler:${libs.versions.daggerVersion.get()}")
    annotationProcessor("com.google.dagger:dagger-android-processor:${libs.versions.daggerVersion.get()}")
    implementation(libs.aboutlibraries)
    implementation(libs.okhttp)
    implementation(libs.picasso)
    implementation(libs.tesseract4android.openmp)
    testImplementation(libs.junit)
    testImplementation(libs.robolectric)
    androidTestImplementation(libs.androidx.test.runner)
    androidTestImplementation(libs.androidx.test.ext.junit)
}

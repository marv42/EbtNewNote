syntax = "proto3";
option java_package = "com.marv42.ebt.newnote";
option java_multiple_files = true;
// Only the sensitive preferences are stored in the encrypted DataStore.
message UserPreferences {
  bool pref_settings_ocr_online = 1 [deprecated = true];
  bool pref_settings_images = 2 [deprecated = true];
  string pref_settings_show_submitted = 3 [deprecated = true];
  string pref_settings_ocr_service_key = 4;
  string pref_settings_country_service_key = 5;
  string pref_settings_email = 6;
  string pref_settings_password = 7;
  string pref_settings_comment = 8 [deprecated = true];
  string pref_settings_color = 9 [deprecated = true];
}
